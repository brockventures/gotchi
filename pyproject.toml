[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gotchi"
version = "0.1.0"
description = "Pocket E-Ink AI Companion & Agent-Configurable Hardware Node"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.0",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
